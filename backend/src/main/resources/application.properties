spring.application.name=teman-belajar-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/temanbelajarsd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@temanbelajar.local}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.donation.owner-email=${DONATION_OWNER_EMAIL:arifrusmana278@gmail.com}
app.backend-public-url=${BACKEND_PUBLIC_URL:http://localhost:8080}
app.donation.mail.host=${MAIL_HOST:}
app.donation.mail.port=${MAIL_PORT:587}
app.donation.mail.username=${MAIL_USERNAME:}
app.donation.mail.password=${MAIL_PASSWORD:}
app.donation.mail.from=${MAIL_FROM:}
app.donation.mail.auth=${MAIL_SMTP_AUTH:true}
app.donation.mail.starttls=${MAIL_SMTP_STARTTLS:true}
app.donation.mail.ssl=${MAIL_SMTP_SSL:false}
app.ai.enabled=${AI_QUESTIONS_ENABLED:false}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1/chat/completions}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:90}
app.ai.questions-per-lesson=${AI_QUESTIONS_PER_LESSON:12}
app.ai.retention-days=${AI_QUESTIONS_RETENTION_DAYS:30}
app.ai.batch-size=${AI_QUESTIONS_BATCH_SIZE:1000}
app.ai.schedule-cron=${AI_QUESTIONS_SCHEDULE_CRON:0 59 23 * * SUN}
app.ai.schedule-zone=${AI_QUESTIONS_SCHEDULE_ZONE:Asia/Jakarta}
app.ai.cleanup-cron=${AI_QUESTIONS_CLEANUP_CRON:0 15 2 * * *}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
